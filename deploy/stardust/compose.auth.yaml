name: ark-proto-auth
services:
  auth:
    image: ark-proto-auth:20261003.6
    pull_policy: never
    container_name: ark-proto-auth
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3109:3000"
    volumes:
      - /opt/ark-proto/auth-secrets/gate.json:/run/secrets/ark-gate.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
