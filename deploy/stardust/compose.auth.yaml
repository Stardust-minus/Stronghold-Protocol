# Optional auth-only view of the same project; prefer compose.yaml up -d --no-deps auth.
name: ark-proto
services:
  auth:
    image: ${ARK_AUTH_IMAGE:?load runtime.env}
    pull_policy: never
    container_name: ark-proto-auth
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3141:3000"
    volumes:
      - /opt/ark-proto/auth-secrets/gate.json:/run/secrets/ark-gate.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
