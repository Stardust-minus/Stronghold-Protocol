# Signed material profile, in the server that runs the material-lb access.lua (the 443 server).
    # mssign.lua only: the ModelScope resolve request, HEAD, with no client header/cookie/body.
    location = /_ark_ms_resolve {
        internal;
        auth_request off;
        access_log off;
        proxy_pass https://ark_ms_api$ark_ms_uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host modelscope.cn;
        # The dataset is private (2026-10-18): a root-only 0400 file with the owner's ModelScope login,
        # `proxy_set_header Cookie "m_session_id=<token>";` (MATERIAL-SOURCES.md). Never logged, never in git.
        include /etc/ark-formal/ms-auth.conf;
        proxy_set_header Connection "";
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; ark-material-signer/1)";
        proxy_set_header Accept "*/*";
        proxy_ssl_server_name on;
        proxy_ssl_name modelscope.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_redirect off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
    }
    # Declares $ark_ms_uri (set per subrequest through ngx.location.capture vars); never matched by a client.
    location = /_ark_ms_declare { internal; set $ark_ms_uri ""; return 404; }
