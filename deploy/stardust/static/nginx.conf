user www-data;
worker_processes 10;
worker_rlimit_nofile 65536;
pid /run/ark-static-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1k;
    autoindex off;
    etag on;
    max_ranges 1;

    log_format asset '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout asset;

    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    map "$status:$uri" $asset_cache {
        default "no-store";
        ~^(200|206|304):/releases/8cd6491/(assets|fonts|vendor)/ "public, max-age=31536000, immutable";
        ~^(200|206|304):/releases/prts-libs-20261004/ "public, max-age=31536000, immutable";
    }

    server {
        listen 3000 ssl http2;
        server_name ark-asset.hanabi-ai.cn;
        root /srv/ark-static;

        ssl_certificate /opt/ark-static/tls/fullchain.pem;
        ssl_certificate_key /opt/ark-static/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ark_static_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Cache-Control $asset_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since, If-Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ark-static ready\n";
        }

        location ~ (^|/)\. {
            return 404;
        }

        location /releases/8cd6491/assets/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_except GET HEAD OPTIONS { deny all; }
            disable_symlinks on from=/srv/ark-static;
            try_files $uri =404;
        }

        location /releases/8cd6491/fonts/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_except GET HEAD OPTIONS { deny all; }
            disable_symlinks on from=/srv/ark-static;
            try_files $uri =404;
        }

        location /releases/8cd6491/vendor/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_except GET HEAD OPTIONS { deny all; }
            disable_symlinks on from=/srv/ark-static;
            try_files $uri =404;
        }

        location /releases/prts-libs-20261004/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_except GET HEAD OPTIONS { deny all; }
            disable_symlinks on from=/srv/ark-static;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
