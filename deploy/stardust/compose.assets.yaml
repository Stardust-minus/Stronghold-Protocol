# Optional assets-only view of the same project; prefer compose.yaml up -d --no-deps ark-proto-assets.
name: ark-proto
services:
  ark-proto-assets:
    image: ${ARK_ASSETS_IMAGE:?load assets-runtime.env}
    pull_policy: never
    container_name: ark-proto-assets
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3130:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ASSET_MANIFEST: /run/config/openi-assets.json
      PREWARM: "1"
    volumes:
      - /opt/ark-proto/openi-resolver/openi-assets.json:/run/config/openi-assets.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
