# Included only by the two game HTML entry locations, never by game assets or /ws.
rewrite_by_lua_block {
    local h = ngx.req.get_headers()
    local accept = h["accept"] or ""
    local document = h["sec-fetch-mode"] == "navigate"
        or (type(accept) == "string" and string.find(accept, "text/html", 1, true))
    if ngx.req.get_method() == "GET" and document and not h["upgrade"] and ngx.var.arg__prts ~= "1" then
        return ngx.redirect("/entry?next=" .. ngx.escape_uri(ngx.var.request_uri), 303)
    end
}

# Authorization is inherited from the HTTPS server. _prts is NOT an access token.
proxy_pass http://127.0.0.1:3108;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP "";
proxy_set_header Upgrade "";
proxy_set_header Connection "";
proxy_set_header Accept-Encoding "";
proxy_read_timeout 60s;
sub_filter '<head>' '<head><script src="/_gate/assets/entry-nav.js"></script>';
sub_filter_once on;
