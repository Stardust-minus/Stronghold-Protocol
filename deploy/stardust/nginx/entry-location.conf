# Include only in the root/index game HTML locations, never business code/data/WS.
# The marker skips an already-played animation, NOT the inherited password gate.
if ($ark_proto_play_entry) { return 303 /entry?next=$ark_proto_next; }
proxy_pass http://ark_proto_game_backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP "";
proxy_set_header Forwarded "";
proxy_set_header Upgrade "";
proxy_set_header Connection "";
proxy_set_header Accept-Encoding "";
proxy_read_timeout 60s;
sub_filter '<head>' '<head><script src="/_gate/assets/entry-nav.js"></script>';
sub_filter_once on;
