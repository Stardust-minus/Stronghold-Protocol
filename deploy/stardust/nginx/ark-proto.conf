upstream ark_proto_assets_backend {
    server 127.0.0.1:3130;
    keepalive 64;
    keepalive_timeout 4s;
}
# Single project: game3120, auth3141, public asset resolver3130.
# Based on the direct-backend live snapshot after the 2026-10-04 simplification.
# Review against the live vhost before any separately authorized installation.
upstream ark_proto_auth_backend {
    server 127.0.0.1:3141;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}
upstream ark_proto_game_backend {
    server 127.0.0.1:3120;
    keepalive 32;
}
# Feedback board (deploy/stardust/feedback) and the Grafana of the monitoring stack (deploy/stardust/monitoring),
# both on loopback of this host (2026-10-16).
upstream ark_proto_feedback_backend {
    server 127.0.0.1:3150;
    keepalive 8;
}
upstream ark_proto_monitor_backend {
    server 127.0.0.1:3160;
    keepalive 8;
}
map $uri $ark_proto_upgrade {
    default '';
    /ws $http_upgrade;
    /_release/v012-alliance-20261004/ws $http_upgrade;
}
map $ark_proto_upgrade $ark_proto_connection { default upgrade; '' ''; }
map "$uri:$request_method" $ark_proto_health_allow {
    default '';
    ~^/healthz:(?!GET$|HEAD$) "GET, HEAD";
}
map "$status:$uri" $ark_proto_cache {
    default "private, no-store";
    ~^(200|206|304):/(assets|fonts|vendor)/ "private, max-age=86400";
    ~^(200|304):/(js|css|sim|shared|data|i18n)/ "private, no-cache";
    # the Vite bundle's chunks are named by their content hash (vite.config.js; the coordinator serves SP_CLIENT=build)
    ~^(200|304):/build/assets/ "private, max-age=31536000, immutable";
    # the feedback page links its files with ?v=<content hash>; Grafana names its build files by content hash
    ~^(200|304):/feedback/assets/ "private, max-age=86400";
    ~^(200|304):/monitor/public/build/ "private, max-age=31536000, immutable";
    ~^(200|304):/monitor/public/ "private, max-age=86400";
}
map $uri $ark_proto_frame { default SAMEORIGIN; /login DENY; /entry DENY; ~^/_gate/ DENY; }
map $uri $ark_proto_referrer { default same-origin; }
map $uri $ark_proto_csp {
    default $upstream_http_content_security_policy;
    /login "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self' https://ark-asset.hanabi-ai.cn:25442; worker-src 'self'; child-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    /entry "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self' https://ark-asset.hanabi-ai.cn:25442; worker-src 'self'; child-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    ~^/_gate/ "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self' https://ark-asset.hanabi-ai.cn:25442; worker-src 'self'; child-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
}
map $http_origin $ark_proto_origin_denied {
    default 1;
    '' 0;
    'https://ark-proto.stardust.matce.cn' 0;
}
# Public resources deliberately allow third-party Origin, with CORS* and no credentials.
# This does NOT relax Origin for code/data/API/auth/WS.
map $uri $ark_proto_public_resource {
    default 0;
    ~^/(assets|media|fonts|vendor)/ 1;
    "~^/_release/v012-alliance-20261004/(?:public/)?(?:assets|media|fonts|vendor)/" 1;
    ~^/_gate/assets/(three\.module\.js|three\.core\.js|css3d\.js|bender-regular\.woff2)$ 1;
}
map "$ark_proto_public_resource:$ark_proto_origin_denied" $ark_proto_private_origin_denied {
    default 0;
    '0:1' 1;
}
map $ark_proto_public_resource $ark_proto_cors { default ''; 1 '*'; }
map "$request_method:$http_sec_fetch_mode:$http_accept:$http_upgrade" $ark_proto_document {
    default 0;
    ~^GET:navigate:.*:$ 1;
    ~^GET:[^:]*:.*text/html.*:$ 1;
}
map $uri $ark_proto_html {
    default 0;
    / 1;
    /index.html 1;
    # Not logged in: these pages go to the login page too (only / and /index.html are play entries).
    /feedback/ 1;
    ~^/monitor/public-dashboards/ 1;

}
map "$ark_proto_html:$ark_proto_document:$arg__prts" $ark_proto_play_entry {
    default 0;
    ~^1:1:(?!1$) 1;
}
map "$ark_proto_html:$ark_proto_document" $ark_proto_unauthorized_html {
    default 0;
    '1:1' 1;
}
map $arg_room $ark_proto_next_room {
    default '';
    "~^[A-Za-z0-9_-]{1,64}$" '%3Froom%3D$arg_room';
}
map $uri $ark_proto_next {
    default $uri$ark_proto_next_room;
    /index.html /$ark_proto_next_room;
}
# Old HTML aliases carry only a reviewed invitation and an already-played animation marker.
# Never reflect token/next/arbitrary query into the normal root entry.
map $arg_room $ark_proto_compat_room {
    default '';
    "~^[A-Za-z0-9_-]{1,64}$" 'room=$arg_room';
}
map $arg__prts $ark_proto_compat_prts { default 0; '1' 1; }
map "$ark_proto_compat_prts:$ark_proto_compat_room" $ark_proto_compat_query {
    default '';
    '1:' '?_prts=1';
    ~^1:(.+)$ '?_prts=1&$1';
    ~^0:(.+)$ '?$1';
}
limit_req_zone $binary_remote_addr zone=ark_proto_auth:1m rate=30r/m;
# ALTCHA challenges cost the gate one PBKDF2 each; a page needs one per login try.
limit_req_zone $binary_remote_addr zone=ark_proto_pow:1m rate=30r/m;
# Concurrent WebSockets per client IP: one IP once held ~3200 scripted sessions; players stay far below.
limit_conn_zone $binary_remote_addr zone=ark_proto_ws_ip:10m;
# ...and per gate session, keyed by the 43-character HMAC of a well-formed session cookie. Requests without
# one are not counted here; auth_request rejects them.
map $http_cookie $ark_gate_session_sig {
    default "";
    "~(?:^|;)\s*__Host-ark_gate=[A-Za-z0-9_-]{1,400}\.(?<ark_gate_sig>[A-Za-z0-9_-]{43})\s*(?:;|$)" $ark_gate_sig;
}
limit_conn_zone $ark_gate_session_sig zone=ark_proto_ws_session:10m;
# Feedback API and the public dashboard's panel queries, per client IP (a whole dashboard refresh is ~20 queries).
limit_req_zone $binary_remote_addr zone=ark_proto_feedback:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ark_proto_monitor:10m rate=20r/s;
# ...and at most 48 dashboard queries in flight in total: simultaneous page loads would otherwise exhaust Grafana's
# memory (tested 2026-10-16).
limit_conn_zone $server_name zone=ark_proto_monitor_all:1m;
# Blocked client ranges: a Hong Kong hosting range that ran scripted sessions through the gate.
geo $ark_proto_blocked {
    default 0;
    103.151.172.0/23 1;
}
# Mainland-China allowlist (deploy/stardust/geo): APNIC CN + Loyalsoldier/geoip cn, rebuilt daily off-host and
# installed into geo/cn-allow.txt; each worker re-reads it when its header changes (no reload). No valid table = allow all.
init_worker_by_lua_block {
    local ok, geo = pcall(dofile, "/www/sites/ark-proto.stardust.matce.cn/geo/ark_geo.lua")
    if ok then
        package.loaded.ark_geo = geo
        geo.start("/www/sites/ark-proto.stardust.matce.cn/geo/cn-allow.txt", 60)
    else
        ngx.log(ngx.ERR, "ark_geo: ", geo)
    end
}
# Material profiles (deploy/stardust/material-lb, MATERIAL-SOURCES.md): list the preload.lua of every profile whose
# access.lua/header.lua a location runs, so the master reads, decodes and validates its inventories once per start or
# reload and the workers inherit them. The only init_by_lua of this http context; a missing or failing file is logged
# and leaves that profile on its lazy per-worker load. This template sends /assets/ and /media/ to OpenI: none.
init_by_lua_block {
    for _, f in ipairs({}) do
        local ok, err = pcall(dofile, f)
        if not ok then ngx.log(ngx.ERR, "material preload: ", err) end
    end
}

server {
    listen 80;
    listen [::]:80;
    server_name ark-proto.stardust.matce.cn;
    if ($ark_proto_blocked) { return 403; }
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/ark-proto.stardust.matce.cn/index;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ark-proto.stardust.matce.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ark-proto.stardust.matce.cn;
    # Another authority on this connection (a client reusing it for a CDN/OBS host it was redirected to) is
    # Misdirected: compliant clients retry it on a new connection to the right server (RFC 9110 15.5.20).
    if ($host != "ark-proto.stardust.matce.cn") { return 421; }
    if ($ark_proto_blocked) { return 403; }
    set_by_lua_block $ark_proto_geo_deny { local geo = package.loaded.ark_geo; return geo and geo.deny(ngx.var.binary_remote_addr) or "" }
    if ($ark_proto_geo_deny) { rewrite ^ /_ark_geo_blocked last; }
    http2 on;
    ssl_certificate /www/sites/ark-proto.stardust.matce.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/ark-proto.stardust.matce.cn/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $ark_proto_frame always;
    add_header Referrer-Policy $ark_proto_referrer always;
    add_header Cache-Control $ark_proto_cache always;
    add_header Content-Security-Policy $ark_proto_csp always;
    add_header Access-Control-Allow-Origin $ark_proto_cors always;
    add_header Allow $ark_proto_health_allow always;
    # Emit exactly one wildcard for public resources, never credentials or duplicate*,*.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_cache off;
    # Preserve upstream Location (including auth and asset redirects) verbatim.
    proxy_redirect off;
    access_log /www/sites/ark-proto.stardust.matce.cn/log/access.log main;
    error_log /www/sites/ark-proto.stardust.matce.cn/log/error.log;
    client_max_body_size 1m;
    if ($ark_proto_private_origin_denied) { return 403; }
    auth_request /_gate/check;
    error_page 401 = @ark_gate_unauthorized;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $ark_proto_upgrade;
    proxy_set_header Connection $ark_proto_connection;
    proxy_connect_timeout 5s;

    location = /_ark_geo_blocked {
        internal;
        auth_request off;
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store" always;
        return 403 "<!doctype html><meta charset=utf-8><title>暂不可用</title><p>本服务目前仅向中国大陆网络开放。</p>\n";
    }
    location = /_gate/check {
        internal;
        auth_request off;
        access_log off;
        proxy_pass http://ark_proto_auth_backend/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /login {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /entry {
        auth_request off;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location ^~ /_gate/ {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /_gate/pow {
        auth_request off;
        limit_req zone=ark_proto_pow burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /_gate/login {
        auth_request off;
        client_max_body_size 4k;
        limit_req zone=ark_proto_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /_gate/profile {
        auth_request off;
        client_max_body_size 4k;
        limit_req zone=ark_proto_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location @ark_gate_unauthorized {
        auth_request off;
        if ($ark_proto_unauthorized_html = 1) { return 303 /login?next=$ark_proto_next; }
        return 401;
    }
    # Raw diagnosis from the same fixed HTTP target as internal status, not game allocation readiness.
    location = /healthz {
        auth_request off;
        if ($request_uri !~ "^/healthz(?:[?]|$)") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $args "";
        proxy_pass http://ark_proto_game_backend/healthz;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }
    # Only exact root health is public; aliases/control/material stay hidden.
    location ~ "^/(?:_release/v012-alliance-20261004/)?(?:public/)?(?:healthz|control|_material)(?:/|$)" { return 404; }
    location = /client-build { proxy_pass http://ark_proto_game_backend; }
    location ^~ /dev/ { return 404; }
    location ~ /\. { return 404; }
    location = /_release/v012-alliance-20261004/ws {
        if ($http_origin != 'https://ark-proto.stardust.matce.cn') { return 403; }
        limit_conn ark_proto_ws_ip 64;
        limit_conn ark_proto_ws_session 8;
        limit_conn_status 429;
        limit_conn_log_level info;
        rewrite ^/_release/v012-alliance-20261004/ws$ /ws break;
        # Inherit ALL server-level headers; a local partial list would lose IP-spoof protection.
        proxy_pass http://ark_proto_game_backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /ws {
        if ($http_origin != 'https://ark-proto.stardust.matce.cn') { return 403; }
        limit_conn ark_proto_ws_ip 64;
        limit_conn ark_proto_ws_session 8;
        limit_conn_status 429;
        limit_conn_log_level info;
        # Upgrade/Connection and trusted forwarding headers are inherited together.
        proxy_pass http://ark_proto_game_backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = / { include /www/sites/ark-proto.stardust.matce.cn/entry-location.conf; }
    location = /index.html {
        include /www/sites/ark-proto.stardust.matce.cn/entry-location.conf;
    }
    location ~ "^/_release/v012-alliance-20261004/(?:public/(?:index\.html)?|index\.html)?$" {
        return 302 /$ark_proto_compat_query;
    }

    # Temporary compatibility for the ONE previously published page prefix.
    # No multi-release routing: all code/WS reaches the same single game backend.
    location ~ "^/_release/v012-alliance-20261004/(?:public/)?(?:assets|media)/" {
        auth_request off;
        rewrite ^/_release/v012-alliance-20261004/(?:public/)?(assets|media)/(.*)$ /$1/$2 break;
        proxy_pass http://ark_proto_assets_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 7s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @ark_proto_asset_fallback;
    }
    location ~ "^/_release/v012-alliance-20261004/(?:public/)?(fonts|vendor)/(.*)$" {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/v012-alliance-20261004/$1/$2$is_args$args;
    }
    location @ark_proto_asset_fallback {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/v012-alliance-20261004$uri$is_args$args;
    }
    location = /_ark_single_status {
        internal;
        auth_request off;
        proxy_pass http://ark_proto_game_backend/healthz;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_read_timeout 3s;
    }
    location = /_server/presence {
        content_by_lua_block {
            local r = ngx.location.capture("/_ark_single_status")
            local cjson = require "cjson.safe"
            local h = r.status == 200 and cjson.decode(r.body) or nil
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({online = h and h.online or 0, available = h ~= nil,
                scope = "single-server", serverNow = math.floor(ngx.now() * 1000)}))
        }
    }
    location ~ "^/_release/v012-alliance-20261004/(?:public/(?:js|css)/|(?:shared|data)/)" {
        rewrite ^/_release/v012-alliance-20261004/(?:public/)?(.*)$ /$1 break;
        proxy_pass http://ark_proto_game_backend;
    }
    location ~ "^/_release/v012-alliance-20261004/server/(?:sim/|data\.js$)" {
        rewrite ^/_release/v012-alliance-20261004/server/(.*)$ /$1 break;
        proxy_pass http://ark_proto_game_backend;
    }
    location = /_release/v012-alliance-20261004/client-build {
        proxy_pass http://ark_proto_game_backend/client-build;
    }
    location /_release/ { return 404; }
    # Normal root entry. Public art/media uses OpenI; fonts/vendor bodies remain on Ningxia.
    location ^~ /assets/ {
        include /www/sites/ark-proto.stardust.matce.cn/asset-resolver-location.conf;
    }
    location ^~ /media/ {
        include /www/sites/ark-proto.stardust.matce.cn/asset-resolver-location.conf;
    }
    location ^~ /fonts/ {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/v012-alliance-20261004$request_uri;
    }
    # Tiny original sibling-import adapter; other vendor bodies remain offloaded to Ningxia.
    location = /vendor/hooks.module.js {
        auth_request off;
        proxy_pass http://ark_proto_game_backend;
    }
    location ^~ /vendor/ {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/v012-alliance-20261004$request_uri;
    }
    location = /_gate/assets/three.module.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.module.js$is_args$args;
    }
    location = /_gate/assets/three.core.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.core.js$is_args$args;
    }
    location = /_gate/assets/css3d.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/css3d.js$is_args$args;
    }
    location = /_gate/assets/bender-regular.woff2 {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/bender-regular.woff2$is_args$args;
    }
    # Feedback board (deploy/stardust/feedback, 2026-10-16), gated like the game. The service receives the gate
    # session's signature for its per-session limits (in memory only) and no cookies.
    location = /feedback { return 301 /feedback/; }
    location ^~ /feedback/ {
        client_max_body_size 32k;
        limit_req zone=ark_proto_feedback burst=40 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ark-Session $ark_gate_session_sig;
        proxy_set_header Cookie "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_pass http://ark_proto_feedback_backend;
    }
    # Public Grafana dashboard (deploy/stardust/monitoring, 2026-10-16), gated like the game: only the public-dashboard
    # page, its query API and Grafana's static files. Login, admin and datasource APIs are not reachable from here.
    # monitor-entry.conf holds `return 302 /monitor/public-dashboards/<access token>;` (publish-dashboard.mjs).
    location = /monitor { return 302 /monitor/; }
    location = /monitor/ { include /www/sites/ark-proto.stardust.matce.cn/monitor-entry.conf; }
    # the network-quality board (uid sp-netq): monitor-net-entry.conf holds its `return 302 /monitor/public-dashboards/<token>;`
    # (publish-dashboard.mjs with DASHBOARD_UID=sp-netq); create it before reloading, nginx -t fails without it.
    location = /monitor/net { include /www/sites/ark-proto.stardust.matce.cn/monitor-net-entry.conf; }
    location = /monitor/net/ { include /www/sites/ark-proto.stardust.matce.cn/monitor-net-entry.conf; }
    # Grafana gets no cookies or credentials from here.
    location ^~ /monitor/public-dashboards/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_pass http://ark_proto_monitor_backend;
    }
    location ^~ /monitor/api/public/ {
        limit_req zone=ark_proto_monitor burst=120 nodelay;
        limit_conn ark_proto_monitor_all 48;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_pass http://ark_proto_monitor_backend;
    }
    location ^~ /monitor/public/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_pass http://ark_proto_monitor_backend;
    }
    location ^~ /monitor/ { return 404; }
    # Root business code/data remains gated; the backend owns its exact file allowlist.
    location / { proxy_pass http://ark_proto_game_backend; }
}
