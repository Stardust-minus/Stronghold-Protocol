upstream ark_proto_auth_backend {
    server 127.0.0.1:3109;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}

map $uri $ark_proto_upgrade {
    default '';
    ~^/ws$ $http_upgrade;
}

map $ark_proto_upgrade $ark_proto_connection {
    default upgrade;
    '' '';
}

map "$status:$uri" $ark_proto_cache {
    default "private, no-store";
    ~^(200|206|304):/(assets|fonts|vendor)/ "private, max-age=86400";
}

map $uri $ark_proto_frame {
    default SAMEORIGIN;
    /login DENY;
    /entry DENY;
    ~^/_gate/ DENY;
}

map $uri $ark_proto_referrer {
    default same-origin;
    /login same-origin;
    ~^/_gate/ same-origin;
}

map $uri $ark_proto_csp {
    default $upstream_http_content_security_policy;
    /login "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    /entry "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    ~^/_gate/ "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
}

limit_req_zone $binary_remote_addr zone=ark_proto_ws:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ark_proto_auth:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ark-proto.stardust.matce.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/ark-proto.stardust.matce.cn/index;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ark-proto.stardust.matce.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ark-proto.stardust.matce.cn;
    http2 on;

    ssl_certificate /www/sites/ark-proto.stardust.matce.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/ark-proto.stardust.matce.cn/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $ark_proto_frame always;
    add_header Referrer-Policy $ark_proto_referrer always;
    add_header Cache-Control $ark_proto_cache always;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy $ark_proto_csp always;
    proxy_cache off;

    access_log /www/sites/ark-proto.stardust.matce.cn/log/access.log main;
    error_log /www/sites/ark-proto.stardust.matce.cn/log/error.log;
    client_max_body_size 1m;

    auth_request /_gate/check;
    error_page 401 = @ark_gate_unauthorized;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Upgrade $ark_proto_upgrade;
    proxy_set_header Connection $ark_proto_connection;
    proxy_connect_timeout 5s;

    location = /_gate/check {
        internal;
        auth_request off;
        access_log off;
        proxy_pass http://ark_proto_auth_backend/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /login {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }

    location = /entry {
        auth_request off;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }

    # The sidecar explicitly allowlists its login/logout actions and static files.
    # URI is preserved: /_gate/healthz and /_gate/server.mjs are not sidecar routes.
    location ^~ /_gate/ {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }

    location = /_gate/login {
        auth_request off;
        client_max_body_size 4k;
        limit_req zone=ark_proto_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }

    location @ark_gate_unauthorized {
        auth_request off;
        content_by_lua_block {
            local h = ngx.req.get_headers()
            local entry = ngx.var.uri == "/" or ngx.var.uri == "/index.html"
            local accept = h["accept"] or ""
            local document = h["sec-fetch-mode"] == "navigate"
                or (type(accept) == "string" and string.find(accept, "text/html", 1, true))
            if entry and ngx.req.get_method() == "GET" and not h["upgrade"] and document then
                return ngx.redirect("/login?next=" .. ngx.escape_uri(ngx.var.request_uri), 303)
            end
            ngx.status = ngx.HTTP_UNAUTHORIZED
            ngx.header["Content-Type"] = "text/plain; charset=utf-8"
            ngx.say("Authentication required")
            return ngx.exit(ngx.HTTP_UNAUTHORIZED)
        }
    }

    location = /ws {
        if ($http_origin != "https://ark-proto.stardust.matce.cn") {
            return 403;
        }
        limit_req zone=ark_proto_ws burst=20 nodelay;
        limit_req_status 429;
        limit_conn perip 32;
        proxy_pass http://127.0.0.1:3108;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Public art/audio source, explicitly approved by the site owner. No game code or session data is exposed.
    # A redirect, NOT a proxy: the browser downloads the large body directly from Ningxia.
    location ^~ /assets/ {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/8cd6491$request_uri;
    }

    # Stable third-party files and fonts are versioned and public. Application code stays on this origin.
    location ^~ /fonts/ {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/8cd6491$request_uri;
    }

    location ^~ /vendor/ {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/8cd6491$request_uri;
    }

    location = /_gate/assets/three.module.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.module.js$is_args$args;
    }

    location = /_gate/assets/three.core.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.core.js$is_args$args;
    }

    location = /_gate/assets/css3d.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/css3d.js$is_args$args;
    }

    location = /_gate/assets/bender-regular.woff2 {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/bender-regular.woff2$is_args$args;
    }

    location = /healthz {
        return 404;
    }

    location ^~ /dev/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location = / {
        include /www/sites/ark-proto.stardust.matce.cn/entry-location.conf;
    }

    location = /index.html {
        include /www/sites/ark-proto.stardust.matce.cn/entry-location.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_read_timeout 60s;
    }
}
