# Beta-only candidate. Render __STATIC_RELEASE__ after paired byte verification; never replace the live vhost.
upstream ark_beta_game_backend { server 10.253.77.2:3220; keepalive 32; }
upstream ark_beta_auth_backend { server 127.0.0.1:3241; keepalive 32; keepalive_timeout 4s; }
upstream ark_beta_assets_backend { server 127.0.0.1:3230; keepalive 32; keepalive_timeout 4s; }
map $uri $ark_beta_upgrade { default ''; /ws $http_upgrade; }
map $ark_beta_upgrade $ark_beta_connection { default upgrade; '' ''; }
map "$uri:$request_method" $ark_beta_health_allow {
    default '';
    ~^/healthz:(?!GET$|HEAD$) "GET, HEAD";
}
map $http_origin $ark_beta_origin_denied {
    default 1;
    '' 0;
    'https://ark-proto-beta.stardust.matce.cn' 0;
}
map $uri $ark_beta_public_resource {
    default 0;
    ~^/(assets|media|fonts|vendor)/ 1;
    ~^/_gate/assets/(three\.module\.js|three\.core\.js|css3d\.js|bender-regular\.woff2)$ 1;
}
map "$ark_beta_public_resource:$ark_beta_origin_denied" $ark_beta_private_origin_denied { default 0; '0:1' 1; }
map $ark_beta_public_resource $ark_beta_cors { default ''; 1 '*'; }
map $uri $ark_beta_frame { default SAMEORIGIN; /login DENY; /entry DENY; ~^/_gate/ DENY; }
map $uri $ark_beta_csp {
    default $upstream_http_content_security_policy;
    /login "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self' https://ark-asset.hanabi-ai.cn:25442; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    /entry "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self' https://ark-asset.hanabi-ai.cn:25442; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    ~^/_gate/ "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self' https://ark-asset.hanabi-ai.cn:25442; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
}
map "$request_method:$http_sec_fetch_mode:$http_accept:$http_upgrade" $ark_beta_document {
    default 0;
    ~^GET:navigate:.*:$ 1;
    ~^GET:[^:]*:.*text/html.*:$ 1;
}
map $uri $ark_beta_html { default 0; / 1; /index.html 1; }
map "$ark_beta_html:$ark_beta_document:$arg__prts" $ark_beta_play_entry { default 0; ~^1:1:(?!1$) 1; }
map "$ark_beta_html:$ark_beta_document" $ark_beta_unauthorized_html { default 0; '1:1' 1; }
map $arg_room $ark_beta_next_room { default ''; "~^[A-Za-z0-9_-]{1,64}$" '%3Froom%3D$arg_room'; }
map $uri $ark_beta_next { default $uri$ark_beta_next_room; /index.html /$ark_beta_next_room; }
limit_req_zone $binary_remote_addr zone=ark_beta_ws:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ark_beta_auth:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ark_beta_perip:1m;

server {
    listen 80;
    listen [::]:80;
    server_name ark-proto-beta.stardust.matce.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/ark-proto-beta.stardust.matce.cn/index;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ark-proto-beta.stardust.matce.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ark-proto-beta.stardust.matce.cn;
    http2 on;
    ssl_certificate /www/sites/ark-proto-beta.stardust.matce.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/ark-proto-beta.stardust.matce.cn/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ARK_BETA_SSL:4m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $ark_beta_frame always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy $ark_beta_csp always;
    add_header Access-Control-Allow-Origin $ark_beta_cors always;
    add_header Allow $ark_beta_health_allow always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_cache off;
    proxy_redirect off;
    access_log /www/sites/ark-proto-beta.stardust.matce.cn/log/access.log main;
    error_log /www/sites/ark-proto-beta.stardust.matce.cn/log/error.log;
    client_max_body_size 1m;
    if ($ark_beta_private_origin_denied) { return 403; }
    auth_request /_gate/check;
    error_page 401 = @ark_beta_gate_unauthorized;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Upgrade $ark_beta_upgrade;
    proxy_set_header Connection $ark_beta_connection;
    proxy_connect_timeout 5s;

    location = /_gate/check {
        internal;
        auth_request off;
        access_log off;
        proxy_pass http://ark_beta_auth_backend/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
    }
    location = /login { auth_request off; client_max_body_size 4k; proxy_pass http://ark_beta_auth_backend; proxy_read_timeout 10s; }
    location = /entry { auth_request off; proxy_pass http://ark_beta_auth_backend; proxy_read_timeout 10s; }
    location ^~ /_gate/ { auth_request off; client_max_body_size 4k; proxy_pass http://ark_beta_auth_backend; proxy_read_timeout 10s; }
    location = /_gate/login {
        auth_request off;
        client_max_body_size 4k;
        limit_req zone=ark_beta_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_beta_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /_gate/profile {
        auth_request off;
        client_max_body_size 4k;
        limit_req zone=ark_beta_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_beta_auth_backend;
        proxy_read_timeout 10s;
    }
    location @ark_beta_gate_unauthorized {
        auth_request off;
        if ($ark_beta_unauthorized_html = 1) { return 303 /login?next=$ark_beta_next; }
        return 401;
    }
    # Raw diagnosis from the same fixed HTTP target as internal status, not game allocation readiness.
    location = /healthz {
        auth_request off;
        if ($request_uri !~ "^/healthz(?:[?]|$)") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $args "";
        proxy_pass http://ark_beta_game_backend/healthz;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }
    # Only exact root health is public; aliases/control/material stay hidden.
    location ~ "^/(?:public/)?(?:healthz|control|_material)(?:/|$)" { return 404; }
    location ^~ /dev/ { return 404; }
    location ^~ /localcode/ { return 404; }
    location ^~ /log/ { return 404; }
    location ^~ /ssl/ { return 404; }
    location ~ /\. { return 404; }
    location /_release/ { return 404; }
    location = /client-build { proxy_pass http://ark_beta_game_backend; }
    location = /ws {
        if ($http_origin != 'https://ark-proto-beta.stardust.matce.cn') { return 403; }
        limit_req zone=ark_beta_ws burst=20 nodelay;
        limit_req_status 429;
        limit_conn ark_beta_perip 32;
        proxy_pass http://ark_beta_game_backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = / { include /www/sites/ark-proto-beta.stardust.matce.cn/entry-location.conf; }
    location = /index.html { include /www/sites/ark-proto-beta.stardust.matce.cn/entry-location.conf; }
    location = /_ark_beta_status {
        internal;
        auth_request off;
        proxy_pass http://ark_beta_game_backend/healthz;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_read_timeout 3s;
    }
    location = /_server/presence {
        content_by_lua_block {
            local r = ngx.location.capture("/_ark_beta_status")
            local cjson = require "cjson.safe"
            local h = r.status == 200 and cjson.decode(r.body) or nil
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({online = h and h.online or 0, available = h ~= nil,
                scope = "beta", serverNow = math.floor(ngx.now() * 1000)}))
        }
    }
    location ^~ /assets/ { include /www/sites/ark-proto-beta.stardust.matce.cn/asset-resolver-location.conf; }
    location ^~ /media/ { include /www/sites/ark-proto-beta.stardust.matce.cn/asset-resolver-location.conf; }
    location @ark_beta_asset_fallback {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/__STATIC_RELEASE__$uri$is_args$args;
    }
    location ^~ /fonts/ { auth_request off; return 302 https://ark-asset.hanabi-ai.cn:25442/releases/__STATIC_RELEASE__$request_uri; }
    location = /vendor/hooks.module.js { auth_request off; proxy_pass http://ark_beta_game_backend; }
    location ^~ /vendor/ { auth_request off; return 302 https://ark-asset.hanabi-ai.cn:25442/releases/__STATIC_RELEASE__$request_uri; }
    location = /_gate/assets/three.module.js { auth_request off; return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.module.js$is_args$args; }
    location = /_gate/assets/three.core.js { auth_request off; return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.core.js$is_args$args; }
    location = /_gate/assets/css3d.js { auth_request off; return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/css3d.js$is_args$args; }
    location = /_gate/assets/bender-regular.woff2 { auth_request off; return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/bender-regular.woff2$is_args$args; }

    # Generated exact JS/CSS locations still execute the gate on hits/HEAD/conditional requests.
    include /www/sites/ark-proto-beta.stardust.matce.cn/localcode-locations.conf;
    location @ark_beta_localcode_fallback {
        auth_request /_gate/check;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://ark_beta_game_backend;
        proxy_cache off;
    }
    location / { proxy_pass http://ark_beta_game_backend; }
}
