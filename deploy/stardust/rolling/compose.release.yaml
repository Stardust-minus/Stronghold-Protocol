# LOCAL CANDIDATE ONLY. New immutable project per release; never reuse the current ark-proto project.
name: ark-release-${SP_RELEASE_ID:?choose a new immutable release ID}
services:
  game:
    image: ${ARK_GAME_IMAGE:?set a newly built immutable image tag or digest}
    pull_policy: never
    user: "1000:1000"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARK_GAME_PORT:?choose an unused loopback port}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      SP_COMBAT: server
      SP_VERIFY: "off"
      SP_COMBAT_WORKERS: "6"
      TRUST_PROXY: auto
      SP_RELEASE_ID: ${SP_RELEASE_ID:?choose a new immutable release ID}
      SP_ROLLING_CONTROL_SOCKET: /run/ark-rolling/${SP_RELEASE_ID}.sock
      # EVERY newly staged backend starts fenced. Gateway activation is a separate manual operation.
      SP_ROLLING_DRAINING: "1"
    volumes:
      - type: bind
        source: ${ARK_ROLLING_PRIVATE_DIR:?manually prepare dedicated UID1000 mode0700 directory}
        target: /run/ark-rolling
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # maxRooms stays the application default 4096; no invented environment override.
    # Intentionally NO game CPU/memory limit, reservation or deploy.resources stanza.
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
