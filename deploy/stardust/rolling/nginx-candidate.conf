# LOCAL CANDIDATE ONLY; never install/reload this automatically.
# Based on live read-only vhost snapshot 2026-10-04: legacy resolver3110 ACTIVE,3111 warming.
# After authorization, review/prepare BOTH snippet files at the explicit rolling-candidate include
# paths below; paths are inside the existing host-network Nginx site's mount, not prefix-relative.
# This whole candidate REPLACES a reviewed vhost; never include it alongside the active one.
# Candidate auth3140/gateway3190 are unused staging coordinates. Stable3108 replacement requires
# first-install empty-game authorized maintenance; existing0.1.2 cannot retain memory on recreation.
upstream ark_proto_auth_backend {
    server 127.0.0.1:3140;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}
upstream ark_proto_assets_backend {
    server 127.0.0.1:3110;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}
upstream ark_rolling_gateway {
    server 127.0.0.1:3190;
    keepalive 32;
}
map $uri $ark_proto_upgrade {
    default '';
    "~^/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/ws$" $http_upgrade;
}
map $ark_proto_upgrade $ark_proto_connection { default upgrade; '' ''; }
map "$status:$uri" $ark_proto_cache {
    default "private, no-store";
    ~^(200|206|304):/(assets|fonts|vendor)/ "private, max-age=86400";
}
map $uri $ark_proto_frame { default SAMEORIGIN; /login DENY; /entry DENY; ~^/_gate/ DENY; }
map $uri $ark_proto_referrer { default same-origin; }
map $uri $ark_proto_csp {
    default $upstream_http_content_security_policy;
    /login "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    /entry "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
    ~^/_gate/ "default-src 'none'; script-src 'self' https://ark-asset.hanabi-ai.cn:25442; style-src 'self'; font-src 'self' https://ark-asset.hanabi-ai.cn:25442; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
}
map $http_origin $ark_rolling_origin_denied {
    default 1;
    '' 0;
    'https://ark-proto.stardust.matce.cn' 0;
}
# Public resources deliberately allow third-party Origin, with CORS* and no credentials.
# This does NOT relax Origin for code/data/API/auth/WS. Gateway must make the same narrow distinction.
map $uri $ark_rolling_public_resource {
    default 0;
    ~^/(assets|media|fonts|vendor)/ 1;
    "~^/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/(?:public/)?(?:assets|media|fonts|vendor)/" 1;
    ~^/_gate/assets/(three\.module\.js|three\.core\.js|css3d\.js|bender-regular\.woff2)$ 1;
}
map "$ark_rolling_public_resource:$ark_rolling_origin_denied" $ark_rolling_private_origin_denied {
    default 0;
    '0:1' 1;
}
map $ark_rolling_public_resource $ark_rolling_cors { default ''; 1 '*'; }
map "$request_method:$http_sec_fetch_mode:$http_accept:$http_upgrade" $ark_rolling_document {
    default 0;
    ~^GET:navigate:.*:$ 1;
    ~^GET:[^:]*:.*text/html.*:$ 1;
}
map $uri $ark_rolling_html {
    default 0;
    / 1;
    /index.html 1;
    "~^/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/public/(?:index\.html)?$" 1;
}
map "$ark_rolling_html:$ark_rolling_document:$arg__prts" $ark_rolling_play_entry {
    default 0;
    ~^1:1:(?!1$) 1;
}
map "$ark_rolling_html:$ark_rolling_document" $ark_rolling_unauthorized_html {
    default 0;
    '1:1' 1;
}
map $arg_room $ark_rolling_next_room {
    default '';
    "~^[A-Za-z0-9_-]{1,64}$" '%3Froom%3D$arg_room';
}
map $uri $ark_rolling_next {
    default $uri$ark_rolling_next_room;
    /index.html /$ark_rolling_next_room;
}
# Gateway root intentionally retains ONLY room. Preserve the already-played marker in this one
# validated canonical redirect instead of weakening its public query contract or playing twice.
map "$uri:$arg__prts:$upstream_http_location" $ark_rolling_location {
    default $upstream_http_location;
    "~^/:1:(/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/public/)$" '$1?_prts=1';
    "~^/:1:(/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/public/\?room=[A-Za-z0-9_-]{1,64})$" '$1&_prts=1';
}
limit_req_zone $binary_remote_addr zone=ark_proto_ws:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ark_proto_auth:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ark_rolling_perip:1m;

server {
    listen 80;
    listen [::]:80;
    server_name ark-proto.stardust.matce.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/ark-proto.stardust.matce.cn/index;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ark-proto.stardust.matce.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ark-proto.stardust.matce.cn;
    http2 on;
    ssl_certificate /www/sites/ark-proto.stardust.matce.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/ark-proto.stardust.matce.cn/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $ark_proto_frame always;
    add_header Referrer-Policy $ark_proto_referrer always;
    add_header Cache-Control $ark_proto_cache always;
    add_header Content-Security-Policy $ark_proto_csp always;
    add_header Location $ark_rolling_location always;
    add_header Access-Control-Allow-Origin $ark_rolling_cors always;
    # Emit exactly one wildcard for public resources, never credentials or duplicate*,*.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Location;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_cache off;
    # Explicit redirect rewriting above avoids Nginx guessing an upstream location with a public port.
    proxy_redirect off;
    access_log /www/sites/ark-proto.stardust.matce.cn/log/access.log main;
    error_log /www/sites/ark-proto.stardust.matce.cn/log/error.log;
    client_max_body_size 1m;
    if ($ark_rolling_private_origin_denied) { return 403; }
    auth_request /_gate/check;
    error_page 401 = @ark_gate_unauthorized;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $ark_proto_upgrade;
    proxy_set_header Connection $ark_proto_connection;
    proxy_connect_timeout 5s;

    location = /_gate/check {
        internal;
        auth_request off;
        access_log off;
        proxy_pass http://ark_proto_auth_backend/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /login {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /entry {
        auth_request off;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location ^~ /_gate/ {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /_gate/login {
        auth_request off;
        client_max_body_size 4k;
        limit_req zone=ark_proto_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location = /_gate/profile {
        auth_request off;
        client_max_body_size 4k;
        limit_req zone=ark_proto_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ark_proto_auth_backend;
        proxy_read_timeout 10s;
    }
    location @ark_gate_unauthorized {
        auth_request off;
        if ($ark_rolling_unauthorized_html = 1) { return 303 /login?next=$ark_rolling_next; }
        return 401;
    }
    # Includes root AND prefixed/public health/control/material. No admin/config/state publication.
    location ~ "^/(?:_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/)?(?:public/)?(?:healthz|control|_material)(?:/|$)" { return 404; }
    location = /client-build { return 404; }
    location ^~ /dev/ { return 404; }
    location ~ /\. { return 404; }
    location ~ "^/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/ws$" {
        if ($http_origin != 'https://ark-proto.stardust.matce.cn') { return 403; }
        limit_req zone=ark_proto_ws burst=20 nodelay;
        limit_req_status 429;
        limit_conn ark_rolling_perip 32;
        proxy_pass http://ark_rolling_gateway;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /ws { return 404; }
    location = / { include /www/sites/ark-proto.stardust.matce.cn/rolling-candidate/nginx-entry-candidate.conf; }
    location = /index.html {
        include /www/sites/ark-proto.stardust.matce.cn/rolling-candidate/nginx-entry-candidate.conf;
        # Run entry's rewrite-phase marker check BEFORE break; gateway accepts root, not /index.html.
        rewrite ^ / break;
    }
    location ~ "^/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/public/(?:index\.html)?$" {
        include /www/sites/ark-proto.stardust.matce.cn/rolling-candidate/nginx-entry-candidate.conf;
    }
    # Only art/media/fonts/vendor are public. These go through the PER-RELEASE gateway registry,
    # not the global3110 legacy resolver and not an unconditional Ningxia fallback for normal images.
    location ~ "^/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}/(?:public/)?(?:assets|media|fonts|vendor)/" {
        auth_request off;
        proxy_pass http://ark_rolling_gateway;
        proxy_read_timeout 60s;
    }
    location = /_server/presence {
        proxy_pass http://ark_rolling_gateway;
        proxy_read_timeout 10s;
    }
    location ~ "^/_release/[A-Za-z0-9][A-Za-z0-9_-]{0,63}(?:/|$)" {
        proxy_pass http://ark_rolling_gateway;
        proxy_read_timeout 60s;
    }
    # Approved legacy PUBLIC routes stay pinned to their old release, independently of current.
    location ^~ /assets/ { include /www/sites/ark-proto.stardust.matce.cn/rolling-candidate/nginx-legacy-assets-candidate.conf; }
    location ^~ /media/ { include /www/sites/ark-proto.stardust.matce.cn/rolling-candidate/nginx-legacy-assets-candidate.conf; }
    location ^~ /fonts/ {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/v012-workers-20261004$request_uri;
    }
    location ^~ /vendor/ {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/v012-workers-20261004$request_uri;
    }
    location @ark_proto_asset_fallback {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/v012-workers-20261004$request_uri;
    }
    location = /_gate/assets/three.module.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.module.js$is_args$args;
    }
    location = /_gate/assets/three.core.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/three.core.js$is_args$args;
    }
    location = /_gate/assets/css3d.js {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/css3d.js$is_args$args;
    }
    location = /_gate/assets/bender-regular.woff2 {
        auth_request off;
        return 302 https://ark-asset.hanabi-ai.cn:25442/releases/prts-libs-20261004/bender-regular.woff2$is_args$args;
    }
    # No unprefixed business-code fallback. Unknown paths fail rather than escape a release.
    location / { return 404; }
}
