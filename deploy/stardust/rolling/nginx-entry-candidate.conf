# Include ONLY in root/index and canonical release HTML. No scripts/data/assets/WS.
# This is an animation marker, never an authorization bypass. auth_request remains inherited.
# Maps emit a sanitized, percent-encoded room query; no nested arbitrary next/token/URL forwarding.
if ($ark_rolling_play_entry) {
    return 303 /entry?next=$ark_rolling_next;
}
proxy_pass http://ark_rolling_gateway;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP "";
proxy_set_header Forwarded "";
proxy_set_header Upgrade "";
proxy_set_header Connection "";
proxy_set_header Accept-Encoding "";
proxy_read_timeout 60s;
# Preserve game index's exact relative imports/importmap and backend nonce/CSP. Add only stable entry-nav.
sub_filter '<head>' '<head><script src="/_gate/assets/entry-nav.js"></script>';
sub_filter_once on;
